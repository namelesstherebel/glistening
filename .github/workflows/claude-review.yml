name: Claude Code Review
# Reviews each pull request with Claude, billed to the Claude subscription
# behind the CLAUDE_CODE_OAUTH_TOKEN secret (create it with `claude setup-token`).
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
permissions:
  contents: read
  pull-requests: write
  id-token: write
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  review:
    name: Claude Code Review
    # Skip drafts, and PRs from forks (they cannot read the secret).
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: anthropics/claude-code-action@a26b07d8c778b0c43f64618e5fd29fd0f8af72e8 # v1.0.250
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Read AGENTS.md and CLAUDE.md first if
            they exist and hold the change to their rules.

            Focus on, in order:
            1. Bugs and incorrect behaviour
            2. Security problems
            3. Missing or broken tests for changed logic
            4. Clear readability or maintainability problems

            Leave inline comments only for real, specific issues, with a
            suggested fix where you can. Skip style nitpicks a linter would
            catch. Finish with one short top-level comment summarising the
            review; if nothing needs changing, say so in one line.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
