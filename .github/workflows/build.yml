name: Native builds
on:
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    name: Native (${{ matrix.target }})
    if: github.event.repository.private == false
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: linux-x64
          - runner: macos-15
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-x64
          - runner: windows-2022
            target: win32-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      GALLIUM_DRIVER: llvmpipe
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1-mesa-dev libgl1-mesa-dri ffmpeg pulseaudio-utils
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Windows dependencies
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DGLISTENING_PROJECTM=OFF
      - name: Build
        run: cmake --build build --config Release --parallel 3
      - name: Software OpenGL for Windows runner
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/windows-mesa.ps1
      - name: Native tests and file smoke
        run: node scripts/ci.mjs
      - name: Install npm archive and run outside checkout
        run: npm run test:install
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.target }}
          path: artifacts/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 2
  bundle:
    name: npm bundle
    needs: native
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - name: Restore executable permissions
        run: chmod +x artifacts/*/glistening bin/glistening.cjs
      - name: Bundle every tested architecture
        run: node scripts/bundle.mjs artifacts dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: glistening-npm
          path: dist/*.tgz
          if-no-files-found: error
          retention-days: 2
