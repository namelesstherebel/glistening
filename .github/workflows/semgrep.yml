name: Semgrep CE
on:
  pull_request: {}
  push: {}
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  semgrep:
    name: Semgrep CE
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install pinned Semgrep CE
        run: python -m pip install semgrep==1.179.0
      - name: Scan source; fail on findings or scan errors
        run: bash .semgrep/scan.sh
